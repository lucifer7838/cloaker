<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: #fff; border-radius: 12px; padding: 3rem; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { font-size: 1.75rem; color: #1f2937; margin-bottom: 1rem; }
        p { color: #4b5563; margin-bottom: 1.5rem; line-height: 1.6; }
        .cta { display: inline-block; background: #667eea; color: #fff; padding: 0.875rem 2rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: background 0.2s; }
        .cta:hover { background: #5a67d8; }
        .badge { display: inline-block; background: #fef3c7; color: #92400e; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">LIMITED TIME</span>
        <h1>Exclusive Offer Just for You</h1>
        <p>Take advantage of this special opportunity. This offer is available for a limited time only. Act now to secure your spot.</p>
        <a href="#" class="cta">Claim Your Offer</a>
    </div>
</body>
</html>
